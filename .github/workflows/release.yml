name: Sideki Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sideki-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate release version
        id: version
        run: echo "tag=v$(node scripts/check-version.mjs)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run build
      - name: Package extension and checksum
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/Sideki-$RELEASE_TAG.zip" .)
          (cd release && sha256sum "Sideki-$RELEASE_TAG.zip" > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -rs --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] |
              if length == 0 then "missing" elif .[0].draft then "draft" else "published" end')
          if [ "$STATE" = published ]; then
            echo "$RELEASE_TAG is already published; keeping its assets unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATE" = missing ]; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA"               --title "Sideki $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "release/Sideki-$RELEASE_TAG.zip"             release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published [Sideki $RELEASE_TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
