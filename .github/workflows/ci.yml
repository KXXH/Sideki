name: Sideki CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm test
        env:
          CHROME_BIN: ''
      - name: Run real Chrome navigation checks
        run: CHROME_BIN="$(command -v google-chrome)" npx --no-install vitest run tests/integration/html-preview-navigation.test.ts --maxWorkers=1
      - run: npm run build
